<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Oración de la semana · Jugar, Crecer y Evangelizar</title>
<style>
  :root{
    --tinta:#1B2F55;
    --dorado:#9A7B3F;
    --papel:#FAF7F0;
    --carta:#FFFFFF;
    --texto:#2B2B28;
    --suave:#6B6B64;
    --linea:#E4DCCB;
    --chip:#EEF2F9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    background:var(--papel);
    color:var(--texto);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  .marco{
    width:min(100% - 2rem, 1100px);
    margin-inline:auto;
    padding-bottom:clamp(32px,6vh,64px);
  }

  /* Cabecera */
  header{
    background:var(--tinta);
    color:#fff;
    padding:clamp(10px,2.5vw,18px) 16px clamp(8px,2vw,14px);
    padding-left:max(16px, env(safe-area-inset-left));
    padding-right:max(16px, env(safe-area-inset-right));
    text-align:center;
  }
  header .lema{
    font-family:Georgia,'Times New Roman',serif;
    font-size:clamp(.95rem, 2.6vw, 1.3rem);
    letter-spacing:.14em;
    text-transform:uppercase;
    text-wrap:balance;
  }
  header .sub{
    font-size:clamp(.62rem, 1.6vw, .78rem);
    color:#C9D2E4;letter-spacing:.24em;text-transform:uppercase;margin-top:2px;
  }

  /* Controles: se recolocan solos según el ancho disponible */
  .controles{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
    gap:10px 14px;
    margin:clamp(14px,3vw,24px) 0 6px;
  }
  .campo label{
    display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;
    color:var(--suave);margin-bottom:4px;
  }
  select{
    width:100%;
    min-height:44px;                 /* área táctil cómoda */
    padding:10px;
    font-size:max(16px, 1rem);       /* evita el zoom de iOS al enfocar */
    color:var(--texto);
    background:var(--carta);border:1px solid var(--linea);border-radius:8px;
  }
  select:focus{outline:3px solid rgba(27,47,85,.35);outline-offset:1px}
  .hoy{text-align:center;margin:4px 0 2px;min-height:24px;font-size:.85rem}
  .hoy .chip{color:var(--dorado);font-weight:600}
  .hoy button{
    background:none;border:none;color:var(--tinta);text-decoration:underline;
    font-size:.9rem;cursor:pointer;padding:6px 8px;min-height:36px;
  }
  .hoy button:focus{outline:2px solid var(--tinta)}

  /* Tarjeta de semana */
  .semana{
    background:var(--carta);
    border:1px solid var(--linea);
    border-radius:12px;
    padding:clamp(16px,3.5vw,28px) clamp(14px,3.5vw,28px) clamp(6px,1.5vw,14px);
    margin-top:12px;
    box-shadow:0 1px 3px rgba(27,47,85,.06);
  }
  .eyebrow{
    text-align:center;
    font-size:clamp(.68rem,1.8vw,.8rem);
    letter-spacing:.18em;text-transform:uppercase;color:var(--suave);
    text-wrap:balance;
  }
  .valor{
    font-family:Georgia,'Times New Roman',serif;
    text-align:center;color:var(--tinta);
    font-size:clamp(1.5rem, 4.5vw, 2.2rem);
    line-height:1.15;font-weight:600;
    margin:6px 0 4px;
    text-wrap:balance;
  }
  .regla{width:64px;height:2px;background:var(--dorado);margin:10px auto 4px;border:none}

  /* Sesiones: apiladas en móvil, en columnas en pantallas anchas */
  #sesiones{display:grid;grid-template-columns:1fr}
  .sesion{border-top:1px solid var(--linea);margin-top:16px;padding-top:14px}
  .sesion:first-of-type{border-top:none}
  .sesion h2{
    font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--tinta);display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  }
  .sesion h2 .tag{
    font-size:.68rem;background:var(--chip);color:var(--tinta);
    padding:2px 8px;border-radius:99px;letter-spacing:.06em;text-transform:none;
  }
  .oracion{margin:10px 0 14px}
  .oracion .rol{
    font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--dorado);
    display:flex;align-items:center;gap:6px;margin-bottom:3px;
  }
  .oracion .rol::before{content:"✝";font-size:.8rem}
  .oracion p{
    font-family:Georgia,'Times New Roman',serif;
    font-style:italic;
    font-size:clamp(1.08rem, 2.6vw, 1.28rem);
    line-height:1.6;
    color:var(--texto);
    max-width:65ch;
  }

  /* Tabletas y escritorio: las tres sesiones lado a lado */
  @media (min-width:820px){
    #sesiones{
      grid-template-columns:repeat(2, 1fr);
      gap:0 36px;
      margin-top:8px;
    }
    .sesion{border-top:1px solid var(--linea);padding:14px 0 6px}
    .sesion:nth-of-type(odd){padding-right:24px;border-right:1px solid var(--linea)}
    .sesion:nth-of-type(even){padding-left:24px}
    .sesion:nth-of-type(-n+2){border-top:none;margin-top:8px}
  }

  footer{
    text-align:center;color:var(--suave);font-size:.75rem;
    margin-top:clamp(20px,4vw,32px);letter-spacing:.06em;
    padding-inline:8px;
  }

  @media (prefers-reduced-motion:no-preference){
    .semana{transition:box-shadow .15s ease}
  }
  @media print{
    header,.controles,.hoy,footer .nota{display:none}
    body{background:#fff}
    .semana{border:none;box-shadow:none}
    #sesiones{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<header>
  <div class="lema">Jugar, Crecer y Evangelizar</div>
  <div class="sub">Oración de la semana</div>
</header>

<div class="marco">
  <div class="controles">
    <div class="campo">
      <label for="selCat">Categoría</label>
      <select id="selCat" aria-label="Categoría deportiva"></select>
    </div>
    <div class="campo">
      <label for="selSem">Semana</label>
      <select id="selSem" aria-label="Semana de la temporada"></select>
    </div>
  </div>
  <div class="hoy" id="zonaHoy" aria-live="polite"></div>

  <article class="semana" id="tarjeta">
    <div class="eyebrow" id="mesTema"></div>
    <div class="valor" id="valor"></div>
    <hr class="regla">
    <div id="sesiones"></div>
  </article>

  <footer>
    <div>Club Deportivo Santo Domingo · Colegio Diocesano Santo Domingo de Orihuela</div>
    <div class="nota">Anexo I del proyecto «Jugar, Crecer y Evangelizar»</div>
  </footer>
</div>

<script>
const DATA = {"benjamin":{"nombre":"Prebenjamín · Benjamín · Alevín","meses":[{"mes":"Septiembre","tema":"«Somos un equipo»","semanas":[{"valor":"Acogida","o":["Jesús, hoy empezamos a entrenar juntos. Ayúdanos a recibir bien a todos los compañeros, para que nadie se quede solo. Amén.","Gracias, Jesús, por este primer entrenamiento y por los nuevos amigos que hemos conocido. Amén.","Señor, enséñanos a hacer sitio a todos en los juegos de hoy. Amén.","Gracias por un equipo donde todos somos bienvenidos. Amén.","Jesús, hoy queremos entrenar la acogida también para casa: recibir bien a papá, a mamá y a los hermanos. Amén.","Gracias por este rato. Esta semana, en el cole, buscaré a quien esté solo para jugar con él. Amén.","Jesús, que en el partido de hoy también los rivales se sientan bien recibidos. Amén.","Gracias por el partido. Nos vamos contentos de haber jugado todos juntos. Amén."]},{"valor":"Confianza","o":["Jesús, hoy queremos aprender a confiar: en Ti, en los entrenadores y en los compañeros. Amén.","Gracias, Señor, porque cuando confiamos unos en otros jugamos mejor y más contentos. Amén.","Señor, ayúdanos a pasar el balón sin miedo, confiando en el compañero. Amén.","Gracias por los compañeros que hoy han confiado en mí. Yo también quiero confiar en ellos. Amén.","Señor, la confianza también se vive en casa: ayúdanos a contar a nuestra familia lo que nos pasa. Amén.","Gracias, Jesús. Hoy me voy con una tarea: confiar en mis padres y contarles cómo me ha ido el día. Amén.","Jesús, en el partido de hoy queremos confiar en el equipo, aunque el rival sea difícil. Amén.","Gracias por este partido. Hemos aprendido que juntos podemos más que solos. Amén."]},{"valor":"Respeto","o":["Jesús, enséñanos hoy a tratar a todos como nos gusta que nos traten. Amén.","Gracias, Señor, por este entrenamiento. Perdónanos si alguna vez no hemos tratado bien a alguien. Amén.","Señor, que hoy cuidemos las palabras y los gestos con los compañeros. Amén.","Gracias, Jesús, porque respetándonos el entrenamiento es más bonito para todos. Amén.","Jesús, que el respeto no se quede en la pista: que también respetemos a los profes y a los abuelos. Amén.","Gracias por lo de hoy. Esta semana cuidaré mis palabras también en casa y en clase. Amén.","Jesús, ayúdanos a respetar hoy al árbitro, a los rivales y a nuestro entrenador. Amén.","Gracias por el partido. Queremos que se nos recuerde por jugar bien y tratar bien. Amén."]},{"valor":"Alegría en los comienzos","o":["Jesús, gracias por este curso que empieza. Queremos vivirlo con mucha alegría. Amén.","Gracias, Señor, por la ilusión de empezar. Que no la perdamos en todo el año. Amén.","Señor, que hoy se nos note la alegría al jugar y contagiemos a los compañeros. Amén.","Gracias, Jesús, por las risas y los juegos de hoy. ¡Qué bien se está en este equipo! Amén.","Señor, queremos llevar la alegría a casa: que nos vean llegar contentos del entrenamiento. Amén.","Gracias, Jesús. Hoy repartiré sonrisas en casa como las reparto aquí. Amén.","Jesús, que ganemos o perdamos, hoy queremos disfrutar del partido. Amén.","Gracias por este comienzo de temporada. Nos vamos a casa con una sonrisa. Amén."]}]},{"mes":"Octubre","tema":"«Jesús nos enseña a amar»","semanas":[{"valor":"Escucha","o":["Jesús, abre bien nuestros oídos para escuchar hoy al entrenador y a los amigos. Amén.","Gracias, Señor, por todo lo que hemos aprendido hoy escuchando con atención. Amén.","Señor, ayúdanos a escuchar a los compañeros sin interrumpir, dentro y fuera del juego. Amén.","Gracias, Jesús, porque escuchándonos nos entendemos mejor y jugamos mejor. Amén.","Jesús, enséñanos a escuchar también en casa y en clase, no solo aquí. Amén.","Gracias por este rato. Esta semana escucharé a mis padres a la primera. Amén.","Jesús, que en el partido sepamos escuchar las indicaciones y animarnos unos a otros. Amén.","Gracias por el partido de hoy. Escuchar al equipo nos ha ayudado a jugar juntos. Amén."]},{"valor":"Servicio","o":["Jesús, Tú viniste a servir. Enséñanos hoy a ayudar sin que nos lo pidan. Amén.","Gracias, Señor, por los que hoy han recogido el material y han ayudado a los demás. Amén.","Señor, que hoy estemos atentos a lo que necesita cada compañero. Amén.","Gracias, Jesús, porque ayudar a los demás nos hace felices a todos. Amén.","Señor, en casa también se puede servir: poner la mesa, recoger, ayudar sin protestar. Ayúdanos. Amén.","Gracias, Jesús. Hoy en casa ayudaré en algo sin que me lo pidan. Amén.","Jesús, en el partido de hoy queremos jugar para el equipo, no solo para nosotros. Amén.","Gracias por este partido. Lo mejor ha sido ayudarnos unos a otros. Amén."]},{"valor":"Perdón","o":["Jesús, Tú siempre perdonas. Enséñanos a pedir perdón y a perdonar de corazón. Amén.","Gracias, Señor, por este entrenamiento. Si hoy hemos molestado a alguien, queremos pedirle perdón. Amén.","Señor, ayúdanos a no enfadarnos por los fallos de los compañeros y a darles otra oportunidad. Amén.","Gracias, Jesús, porque perdonarnos nos deja el corazón tranquilo y contento. Amén.","Jesús, si nos hemos enfadado con alguien de casa o del cole, ayúdanos a hacer las paces hoy. Amén.","Gracias por este entrenamiento. Antes de dormir pediré perdón si he hecho daño a alguien. Amén.","Jesús, si en el partido hay roces o fallos, ayúdanos a perdonar rápido y seguir jugando. Amén.","Gracias por el partido. Nos vamos sin enfados, como amigos. Amén."]},{"valor":"Amor al prójimo","o":["Jesús, Tú nos dijiste que nos amáramos unos a otros. Ayúdanos a hacerlo en el equipo. Amén.","Gracias, Señor, por los compañeros. Queremos quererlos como Tú nos quieres. Amén.","Señor, que hoy cuidemos especialmente al compañero que esté más triste o más solo. Amén.","Gracias, Jesús, por este rato juntos. Queriéndonos, el equipo es como una familia. Amén.","Señor, queremos querer también fuera de la pista: a la familia, a los amigos, a los compañeros de clase. Amén.","Gracias, Jesús. Esta semana daré un abrazo fuerte a mi familia de tu parte. Amén.","Jesús, que hoy en el partido se note que somos amigos: animándonos y ayudándonos. Amén.","Gracias por el partido. Ganar amigos es más importante que ganar partidos. Amén."]}]},{"mes":"Noviembre","tema":"«Ser luz en el equipo»","semanas":[{"valor":"Ejemplo","o":["Jesús, Tú eres nuestro mejor ejemplo. Ayúdanos hoy a portarnos de forma que otros aprendan de nosotros. Amén.","Gracias, Señor, por los compañeros que hoy han dado buen ejemplo. Queremos parecernos a ellos. Amén.","Señor, que hoy nuestras acciones enseñen más que nuestras palabras. Amén.","Gracias, Jesús, por ayudarnos a ser buen ejemplo unos para otros. Amén.","Jesús, que también demos buen ejemplo en el cole: en la fila, en el patio y en clase. Amén.","Gracias por lo de hoy. Mañana en el cole intentaré ser ejemplo como aquí. Amén.","Jesús, que en el partido de hoy demos ejemplo de juego limpio a todos los que nos vean. Amén.","Gracias por el partido. Ojalá alguien haya aprendido algo bueno viéndonos jugar. Amén."]},{"valor":"Amistad","o":["Jesús, gracias por los amigos del equipo. Enséñanos a ser buenos amigos como Tú. Amén.","Gracias, Señor, por este entrenamiento con amigos. Cuida de cada uno de ellos. Amén.","Señor, ayúdanos a no dejar a nadie fuera y a hacer nuevos amigos hoy. Amén.","Gracias, Jesús, porque el deporte nos regala amigos de verdad. Amén.","Señor, los amigos del equipo y los del cole son un regalo: ayúdanos a cuidarlos a todos. Amén.","Gracias, Jesús. Esta semana invitaré a jugar a algún compañero de clase nuevo. Amén.","Jesús, que hoy juguemos como amigos y tratemos a los rivales también como amigos. Amén.","Gracias por el partido. Los amigos del equipo son nuestro mejor premio. Amén."]},{"valor":"Buen comportamiento","o":["Jesús, ayúdanos hoy a portarnos bien: en el vestuario, en la pista y con todos. Amén.","Gracias, Señor, por este entrenamiento. Queremos portarnos igual de bien en casa y en clase. Amén.","Señor, que hoy sepamos obedecer a la primera y jugar sin peleas. Amén.","Gracias, Jesús, porque cuando nos portamos bien, todos disfrutamos más. Amén.","Jesús, portarse bien también toca en casa: obedecer, recoger y hablar bien. Ayúdanos. Amén.","Gracias por este rato. Hoy en casa me portaré igual de bien que aquí. Amén.","Jesús, que en el partido de hoy nos portemos bien aunque el resultado no nos guste. Amén.","Gracias por el partido. Estamos contentos porque nos hemos portado como buenos deportistas. Amén."]},{"valor":"Esperanza","o":["Jesús, enséñanos a no rendirnos nunca y a esperar siempre cosas buenas. Amén.","Gracias, Señor, porque contigo siempre podemos mejorar y aprender. Amén.","Señor, si hoy algo nos sale mal, ayúdanos a intentarlo otra vez con ánimo. Amén.","Gracias, Jesús, por darnos fuerzas cuando estamos cansados o desanimados. Amén.","Señor, cuando algo del cole o de casa nos salga mal, ayúdanos a no desanimarnos y volver a intentarlo. Amén.","Gracias, Jesús. Si esta semana algo me cuesta, lo intentaré otra vez con esperanza. Amén.","Jesús, aunque el partido se ponga difícil, ayúdanos a luchar hasta el final con esperanza. Amén.","Gracias por el partido. Hemos aprendido a no rendirnos, y eso vale más que el resultado. Amén."]}]},{"mes":"Diciembre","tema":"«Jesús nace para todos» (Navidad)","semanas":[{"valor":"Espera (Adviento)","o":["Jesús, empieza el Adviento: queremos preparar nuestro corazón para tu llegada. Amén.","Gracias, Señor, por este tiempo de espera. Ayúdanos a prepararnos siendo mejores compañeros. Amén.","Señor, mientras esperamos la Navidad, que cada entrenamiento nos haga un poco mejores. Amén.","Gracias, Jesús, porque esperarte juntos es más bonito. Ven pronto a nuestros corazones. Amén.","Jesús, en Adviento también esperamos en casa: ayúdanos a preparar la Navidad con la familia. Amén.","Gracias por este rato. Esta semana ayudaré a preparar la Navidad en casa con buena cara. Amén.","Jesús, en el partido de hoy queremos jugar con la ilusión de quien espera algo muy grande. Amén.","Gracias por el partido. Seguimos preparando el corazón para recibirte en Navidad. Amén."]},{"valor":"Preparación","o":["Jesús, ayúdanos a preparar bien la Navidad: por fuera con adornos y por dentro con buenas acciones. Amén.","Gracias, Señor, por este entrenamiento. Cada esfuerzo es un regalo que te preparamos. Amén.","Señor, que hoy preparemos también nuestro corazón, quitando enfados y malas caras. Amén.","Gracias, Jesús, por ayudarnos a estar preparados para Ti y para los demás. Amén.","Señor, preparar tu llegada es también hacer las tareas y ayudar sin quejarnos. Amén.","Gracias, Jesús. Mi regalo para tu cumpleaños: portarme mejor cada día que falta. Amén.","Jesús, igual que preparamos el partido entrenando, queremos preparar tu llegada portándonos bien. Amén.","Gracias por el partido. Nuestro corazón está un poquito más preparado para la Navidad. Amén."]},{"valor":"Acogida","o":["Jesús, cuando naciste no había sitio para Ti. Que en nuestro equipo siempre haya sitio para todos. Amén.","Gracias, Señor, por este entrenamiento. Queremos ser un equipo con las puertas abiertas. Amén.","Señor, ayúdanos a acoger hoy a cada compañero como si te acogiéramos a Ti. Amén.","Gracias, Jesús, porque en este equipo nadie sobra y todos somos importantes. Amén.","Jesús, que en casa también haya sitio para todos: para el hermano pequeño y para el abuelo. Amén.","Gracias por lo de hoy. En Navidad estaré atento a que nadie de mi familia se sienta solo. Amén.","Jesús, que hoy recibamos bien a todos: rivales, árbitros y familias que vienen a vernos. Amén.","Gracias por el partido. Queremos que nuestro equipo sea como un portal: con sitio para todos. Amén."]},{"valor":"Alegría compartida","o":["Jesús, tu nacimiento es la alegría más grande. Ayúdanos a compartirla con todos. Amén.","Gracias, Señor, por la alegría de la Navidad que ya se acerca. Queremos repartirla en casa. Amén.","Señor, que hoy compartamos la alegría: celebrando juntos lo bueno de cada compañero. Amén.","Gracias, Jesús, porque la alegría compartida se hace el doble de grande. ¡Feliz Navidad a todos! Amén.","Señor, la alegría de la Navidad es para compartirla en casa: ayúdanos a llevarla nosotros. Amén.","Gracias, Jesús. Estas fiestas felicitaré la Navidad a mi familia con un beso enorme. Amén.","Jesús, que hoy celebremos cada jugada bonita, la haga quien la haga. Amén.","Gracias por el partido y por este año que acaba. Nos vamos a celebrar tu nacimiento con alegría. Amén."]}]},{"mes":"Enero","tema":"«Seguimos su estrella» (Epifanía)","semanas":[{"valor":"Renovación","o":["Jesús, empieza un año nuevo. Queremos empezar también nosotros con ganas renovadas. Amén.","Gracias, Señor, por este primer entrenamiento del año. Ayúdanos a cumplir nuestros buenos propósitos. Amén.","Señor, ayúdanos a estrenar el año siendo mejores compañeros que el año pasado. Amén.","Gracias, Jesús, por darnos cada día una nueva oportunidad para mejorar. Amén.","Jesús, el año nuevo también empieza en casa y en el cole: ayúdanos a estrenar buenos propósitos allí. Amén.","Gracias por este rato. Mi propósito de esta semana: empezar bien las tareas sin protestar. Amén.","Jesús, en el primer partido del año queremos jugar con ilusión de estreno. Amén.","Gracias por el partido. Este año nuevo lo queremos vivir contigo. Amén."]},{"valor":"Búsqueda de lo bueno","o":["Jesús, como los Reyes Magos buscaron tu estrella, ayúdanos a buscar siempre lo bueno. Amén.","Gracias, Señor, por este entrenamiento. Ayúdanos a fijarnos en lo bueno de cada compañero. Amén.","Señor, que hoy busquemos lo bueno: la jugada bien hecha, la palabra amable, la ayuda a tiempo. Amén.","Gracias, Jesús, porque cuando buscamos lo bueno, lo encontramos. Amén.","Señor, ayúdanos a buscar lo bueno también en el cole: en los profes, en los compañeros, en las clases. Amén.","Gracias, Jesús. Mañana me fijaré en algo bueno de un compañero y se lo diré. Amén.","Jesús, que hoy en el partido busquemos jugar bien y hacer el bien, las dos cosas. Amén.","Gracias por el partido. Hemos encontrado cosas buenas: esfuerzo, amistad y diversión. Amén."]},{"valor":"Luz interior","o":["Jesús, Tú eres la luz del mundo. Enciende también una lucecita buena dentro de nosotros. Amén.","Gracias, Señor, por la luz que pones en nuestro corazón cuando hacemos el bien. Amén.","Señor, que hoy nuestra luz alumbre a los compañeros: con sonrisas, ánimos y ayuda. Amén.","Gracias, Jesús, porque un equipo con luz por dentro se nota por fuera. Amén.","Jesús, que nuestra lucecita también alumbre en casa: con buen humor y buenas palabras. Amén.","Gracias por lo de hoy. Esta semana llevaré mi luz a casa: menos quejas y más sonrisas. Amén.","Jesús, que hoy en el partido brille nuestra mejor luz: el juego limpio. Amén.","Gracias por el partido. Queremos llevar esta luz también al cole y a casa. Amén."]},{"valor":"Gratitud","o":["Jesús, gracias por poder entrenar, por la salud y por este equipo. Hoy queremos darte las gracias por todo. Amén.","Gracias, Señor, por este rato de deporte. Y gracias por los entrenadores que nos enseñan tanto. Amén.","Señor, ayúdanos a decir más veces «gracias»: a los compañeros, a los profes y a nuestras familias. Amén.","Gracias, Jesús, por los amigos de este equipo. Son un regalo tuyo. Amén.","Señor, también queremos dar las gracias en casa: por la comida, por los cuidados, por el cariño. Amén.","Gracias, Jesús. Hoy en la cena diré «gracias» a quien la haya preparado. Amén.","Jesús, gracias por este partido que vamos a jugar. Que sepamos disfrutarlo como un regalo. Amén.","Gracias por el partido, por los rivales y por los que han venido a animarnos. Amén."]}]},{"mes":"Febrero","tema":"«Elijo hacer el bien»","semanas":[{"valor":"Discernimiento","o":["Jesús, ayúdanos a distinguir lo que está bien de lo que está mal, en el juego y en la vida. Amén.","Gracias, Señor, por enseñarnos hoy a pensar antes de actuar. Amén.","Señor, cuando no sepamos qué hacer, ayúdanos a preguntarnos: ¿qué haría Jesús? Amén.","Gracias, Jesús, porque con tu ayuda aprendemos a elegir lo bueno. Amén.","Jesús, elegir lo bueno también toca en el patio y en casa: ayúdanos a pensar antes de actuar. Amén.","Gracias por este rato. Esta semana, antes de hacer algo dudoso, me preguntaré: ¿está bien? Amén.","Jesús, en el partido de hoy ayúdanos a elegir bien: jugar limpio aunque nadie nos vea. Amén.","Gracias por el partido. Hoy hemos practicado elegir lo bueno, y queremos seguir haciéndolo. Amén."]},{"valor":"Libertad responsable","o":["Jesús, gracias por dejarnos elegir. Ayúdanos a usar bien esa libertad. Amén.","Gracias, Señor, por este entrenamiento. Ser libres es también hacernos responsables de lo que hacemos. Amén.","Señor, que hoy elijamos por nosotros mismos portarnos bien, sin que nadie nos obligue. Amén.","Gracias, Jesús, porque elegir el bien nos hace de verdad libres y felices. Amén.","Señor, en casa también somos libres de elegir: ayúdanos a elegir ayudar y obedecer. Amén.","Gracias, Jesús. Hoy elegiré yo solito hacer algo bueno en casa, sin que me lo manden. Amén.","Jesús, en el partido nadie puede elegir por nosotros: ayúdanos a elegir siempre el juego limpio. Amén.","Gracias por el partido. Hemos elegido bien y estamos orgullosos de nuestro equipo. Amén."]},{"valor":"Compromiso","o":["Jesús, enséñanos a cumplir lo que prometemos: venir a entrenar, esforzarnos y ayudar. Amén.","Gracias, Señor, por este entrenamiento. Queremos comprometernos a dar lo mejor cada día. Amén.","Señor, ayúdanos a no fallar al equipo y a estar cuando los compañeros nos necesitan. Amén.","Gracias, Jesús, por los compañeros que siempre están. Queremos ser como ellos. Amén.","Jesús, cumplir lo prometido también vale para las tareas y los recados. Ayúdanos a no olvidarlo. Amén.","Gracias por lo de hoy. Esta semana cumpliré lo que prometa en casa y en el cole. Amén.","Jesús, hoy nos comprometemos a luchar el partido entero, desde el principio hasta el final. Amén.","Gracias por el partido. Hemos cumplido nuestro compromiso: darlo todo. Amén."]},{"valor":"Justicia","o":["Jesús, enséñanos a ser justos: a repartir bien, a no hacer trampas y a defender al débil. Amén.","Gracias, Señor, por este entrenamiento. Queremos que en nuestro equipo todo se haga con justicia. Amén.","Señor, ayúdanos a que hoy todos tengan su oportunidad de jugar y participar. Amén.","Gracias, Jesús, porque en un equipo justo todos estamos más contentos. Amén.","Señor, que también seamos justos en el patio: repartir bien, no hacer trampas, defender al pequeño. Amén.","Gracias, Jesús. Mañana en el recreo me aseguraré de que nadie se quede sin jugar. Amén.","Jesús, que hoy aceptemos las decisiones del árbitro y ganemos solo con juego limpio. Amén.","Gracias por el partido. Preferimos perder siendo justos que ganar con trampas. Amén."]}]},{"mes":"Marzo","tema":"«Nos preparamos por dentro» (Cuaresma)","semanas":[{"valor":"Conversión","o":["Jesús, empieza la Cuaresma: queremos cambiar lo que no hacemos bien para acercarnos más a Ti. Amén.","Gracias, Señor, por este entrenamiento. Ayúdanos a cambiar poco a poco lo que nos cuesta. Amén.","Señor, ayúdanos hoy a corregir un mal hábito: quejarnos, enfadarnos o desanimarnos. Amén.","Gracias, Jesús, porque con tu ayuda podemos ser cada semana un poquito mejores. Amén.","Jesús, la Cuaresma también se vive en casa: ayúdanos a cambiar allí lo que no hacemos bien. Amén.","Gracias por este rato. Esta semana intentaré quitarme una mala costumbre de casa. Amén.","Jesús, que en el partido de hoy se note que estamos cambiando a mejor. Amén.","Gracias por el partido. Seguimos entrenando por fuera y cambiando por dentro. Amén."]},{"valor":"Silencio y oración","o":["Jesús, enséñanos a estar un momento en silencio contigo antes de empezar. (Silencio breve.) Amén.","Gracias, Señor, por este rato. El silencio también nos ayuda a escucharte. Amén.","Señor, que hoy aprendamos a callar para escuchar mejor: a Ti, al entrenador y a los amigos. Amén.","Gracias, Jesús, por este entrenamiento. Esta noche, antes de dormir, queremos rezarte un poquito. Amén.","Señor, enséñanos a buscar un ratito de silencio en casa para hablar contigo antes de dormir. Amén.","Gracias, Jesús. Esta noche te rezaré un poquito desde mi cama. Amén.","Jesús, en un momento de silencio te pedimos por este partido y por todos los que van a jugarlo. Amén.","Gracias por el partido. En el silencio de nuestro corazón te decimos: gracias. Amén."]},{"valor":"Esfuerzo interior","o":["Jesús, en Cuaresma entrenamos también por dentro: ayúdanos a esforzarnos en ser buenos. Amén.","Gracias, Señor, por este entrenamiento. El esfuerzo de hoy nos hace más fuertes por dentro y por fuera. Amén.","Señor, ayúdanos a esforzarnos cuando nadie nos ve, que es cuando más vale. Amén.","Gracias, Jesús, porque esforzarse por los demás llena el corazón. Amén.","Jesús, esforzarse también es hacer los deberes bien y ayudar aunque cueste. Danos fuerza. Amén.","Gracias por lo de hoy. Esta semana pondré esfuerzo también en los deberes. Amén.","Jesús, que hoy luchemos cada balón con esfuerzo, sin protestar y sin rendirnos. Amén.","Gracias por el partido. El esfuerzo de hoy te lo ofrecemos a Ti. Amén."]},{"valor":"Ayuno y solidaridad","o":["Jesús, en Cuaresma aprendemos a compartir. Ayúdanos a pensar en los niños que tienen menos que nosotros. Amén.","Gracias, Señor, por todo lo que tenemos. Queremos compartirlo con quien lo necesita. Amén.","Señor, ayúdanos hoy a renunciar a algún capricho para poder ayudar a otros. Amén.","Gracias, Jesús, porque compartir nos hace más felices que tener. Amén.","Señor, compartir empieza en casa: los juguetes, la merienda, el tiempo. Ayúdanos. Amén.","Gracias, Jesús. Esta semana compartiré algo mío con mi hermano o con un amigo. Amén.","Jesús, hoy jugamos también por los niños que no pueden jugar. Que no los olvidemos. Amén.","Gracias por el partido. Somos afortunados por poder jugar, y queremos ser generosos. Amén."]}]},{"mes":"Abril","tema":"«Jesús vive» (Pascua)","semanas":[{"valor":"Vida nueva","o":["Jesús, ¡has resucitado! Gracias por la Pascua. Queremos vivir con la alegría de saber que estás vivo. Amén.","Gracias, Señor, por este entrenamiento de Pascua. Contigo todo se hace nuevo. Amén.","Señor, ayúdanos a estrenar vida nueva: dejando atrás peleas y estrenando amistad. Amén.","Gracias, Jesús, porque cada día contigo es una vida nueva que empieza. Amén.","Jesús resucitado, que la vida nueva se note también en casa: estrenamos alegría y buenos modos. Amén.","Gracias por este rato. Llevaré la alegría de la Pascua a casa: ¡ha resucitado! Amén.","Jesús resucitado, que hoy juguemos con energía nueva y alegría de Pascua. Amén.","Gracias por el partido. ¡Jesús vive, y nosotros vivimos contentos! Amén."]},{"valor":"Paz","o":["Jesús, cuando resucitaste dijiste: «Paz a vosotros». Danos hoy tu paz. Amén.","Gracias, Señor, por este entrenamiento en paz, sin peleas ni malas caras. Amén.","Señor, ayúdanos a ser niños de paz: que donde estemos nosotros, no haya peleas. Amén.","Gracias, Jesús, por tu paz. Queremos llevarla a casa y al cole. Amén.","Señor, danos tu paz también para casa: sin peleas con los hermanos y sin gritos. Amén.","Gracias, Jesús. Esta semana seré pacificador en casa: si hay pelea, yo pongo la paz. Amén.","Jesús, que hoy juguemos con paz: sin nervios, sin enfados y sin malas palabras. Amén.","Gracias por el partido. Nos vamos en paz con todos: compañeros, rivales y árbitro. Amén."]},{"valor":"Fe","o":["Jesús, creemos en Ti aunque no te veamos. Haz crecer nuestra fe como crece nuestro juego. Amén.","Gracias, Señor, por este entrenamiento. Gracias por estar siempre con nosotros, también en la pista. Amén.","Señor, ayúdanos a confiar en Ti como confiamos en un buen pase: con los ojos cerrados. Amén.","Gracias, Jesús, porque saber que Tú estás nos da seguridad y alegría. Amén.","Jesús, Tú también estás en casa y en el cole, no solo aquí. Ayúdanos a recordarlo. Amén.","Gracias por lo de hoy. Mañana me acordaré de que Tú vas conmigo también al cole. Amén.","Jesús, hoy jugamos sabiendo que Tú nos ves y nos acompañas. ¡Qué bien se juega así! Amén.","Gracias por el partido. Nuestra fe también ha jugado hoy con nosotros. Amén."]},{"valor":"Gozo en la Resurrección","o":["Jesús, la Pascua nos llena de alegría. Que hoy se nos note en la cara y en el juego. Amén.","Gracias, Señor, por la alegría de la Resurrección. Es la alegría más grande del año. Amén.","Señor, ayúdanos a contagiar hoy nuestra alegría a todo el equipo. Amén.","Gracias, Jesús, por este rato tan bueno. La alegría compartida es alegría de Pascua. Amén.","Señor, que la alegría de la Pascua se quede en casa toda la semana. Amén.","Gracias, Jesús. Contaré en casa algo bonito de hoy para alegrar la cena. Amén.","Jesús, que hoy celebremos el partido como una fiesta, pase lo que pase en el marcador. Amén.","Gracias por el partido. Nos vamos con el corazón contento: ¡aleluya! Amén."]}]},{"mes":"Mayo","tema":"«Con María, decimos sí»","semanas":[{"valor":"Confianza en Dios","o":["Jesús, María confió en Dios con todo su corazón. Enséñanos a confiar así. Amén.","Gracias, Señor, por este entrenamiento. Como María, queremos fiarnos de Ti. Amén.","Señor, cuando algo nos dé miedo o nos cueste, ayúdanos a decir como María: «hágase». Amén.","Gracias, Jesús, por tu Madre, que nos enseña a confiar sin miedo. Amén.","Jesús, María confiaba en Dios en su casa de Nazaret: enséñanos a confiar también en la nuestra. Amén.","Gracias por este rato. Esta noche le rezaré un avemaría a la Virgen con mi familia. Amén.","Jesús, hoy jugamos confiando en Ti: haremos nuestra parte y Tú harás la tuya. Amén.","Gracias por el partido, María. Contigo de la mano, confiamos siempre en Dios. Amén."]},{"valor":"Obediencia","o":["Jesús, María dijo «sí» a Dios. Ayúdanos a decir «sí» a lo que nos piden nuestros mayores. Amén.","Gracias, Señor, por este entrenamiento. Obedecer a la primera hace todo más fácil. Amén.","Señor, ayúdanos a escuchar y obedecer al entrenador, aunque a veces nos cueste. Amén.","Gracias, Jesús, porque obedecer con buena cara es una forma de querer. Amén.","Señor, obedecer también toca en casa y en clase, a la primera y con buena cara. Ayúdanos. Amén.","Gracias, Jesús. Esta semana obedeceré en casa a la primera, como María. Amén.","Jesús, que hoy sigamos las indicaciones del entrenador y las reglas del juego con alegría. Amén.","Gracias por el partido. Obedeciendo y jugando juntos, todo sale mejor. Amén."]},{"valor":"Valentía","o":["Jesús, María fue muy valiente. Danos valentía para hacer siempre lo correcto. Amén.","Gracias, Señor, por este entrenamiento. Ser valiente es intentarlo aunque dé miedo fallar. Amén.","Señor, danos valentía para defender al compañero y decir la verdad. Amén.","Gracias, Jesús, por los momentos en que hoy hemos sido valientes. Amén.","Jesús, danos valentía también en el cole: para decir la verdad y defender al que lo pasa mal. Amén.","Gracias por lo de hoy. Si esta semana veo algo injusto en el patio, seré valiente. Amén.","Jesús, que hoy juguemos sin miedo: valientes para intentar, valientes para fallar y seguir. Amén.","Gracias por el partido. Hemos sido valientes, y eso ya es ganar. Amén."]},{"valor":"Humildad","o":["Jesús, María era sencilla y humilde. Enséñanos a no creernos más que nadie. Amén.","Gracias, Señor, por este entrenamiento. Todos tenemos cosas que aprender de los demás. Amén.","Señor, ayúdanos a celebrar lo bueno de los compañeros sin envidia y a reconocer nuestros fallos. Amén.","Gracias, Jesús, porque los humildes hacen equipo y los presumidos lo rompen. Amén.","Señor, la humildad también se practica en casa: pedir las cosas por favor y reconocer los fallos. Amén.","Gracias, Jesús. Hoy en casa pediré perdón si me equivoco, sin excusas. Amén.","Jesús, si hoy ganamos, que no presumamos; y si perdemos, que felicitemos al rival. Amén.","Gracias por el partido. Con humildad, seguiremos aprendiendo cada día. Amén."]}]},{"mes":"Junio","tema":"«Gracias por todo» (fin de curso)","semanas":[{"valor":"Memoria","o":["Jesús, ayúdanos hoy a recordar todo lo bueno que hemos vivido este curso en el equipo. Amén.","Gracias, Señor, por tantos buenos recuerdos: juegos, risas, partidos y amigos. Amén.","Señor, que no olvidemos lo aprendido: los valores valen para siempre, no solo para la temporada. Amén.","Gracias, Jesús, por cada compañero con el que hemos compartido este año. Amén.","Jesús, ayúdanos a contar en casa todo lo bueno que hemos vivido este curso en el equipo. Amén.","Gracias por este rato. Esta semana contaré a mi familia mi mejor recuerdo del año. Amén.","Jesús, hoy jugamos recordando todo lo aprendido este curso. Que se note en el campo. Amén.","Gracias por el partido y por todos los partidos de este año. Los guardamos en el corazón. Amén."]},{"valor":"Gratitud","o":["Jesús, hoy queremos darte las gracias por este curso: por el deporte, los amigos y los entrenadores. Amén.","Gracias, Señor, por todo lo que hemos recibido. Ayúdanos a decir «gracias» también en casa. Amén.","Señor, gracias por nuestros entrenadores y monitores, que nos han cuidado y enseñado tanto. Amén.","Gracias, Jesús, por nuestras familias, que nos traen, nos animan y nos esperan. Amén.","Señor, queremos dar las gracias también en casa: a los que nos traen, nos animan y nos cuidan. Amén.","Gracias, Jesús. Hoy daré las gracias en casa por traerme a entrenar todo el año. Amén.","Jesús, este partido queremos jugarlo como un gran «gracias» por toda la temporada. Amén.","Gracias por el partido y por este curso entero. ¡Ha sido un regalo! Amén."]},{"valor":"Celebración","o":["Jesús, se acaba el curso y queremos celebrarlo contigo, que has estado en cada entrenamiento. Amén.","Gracias, Señor, por este día de fiesta. Celebrar juntos también es cosa de equipo. Amén.","Señor, que hoy celebremos lo importante: lo que hemos crecido y lo amigos que somos. Amén.","Gracias, Jesús, por la alegría de hoy. Las fiestas contigo son las mejores. Amén.","Jesús, celebrar también es cosa de familia: que compartamos con ellos la fiesta de fin de curso. Amén.","Gracias por lo de hoy. Invitaré a mi familia a celebrar conmigo el final del curso. Amén.","Jesús, que este partido sea una fiesta del deporte: con alegría, respeto y juego limpio. Amén.","Gracias por el partido y por la celebración. ¡Qué bonito acabar así el curso! Amén."]},{"valor":"Despedida con esperanza","o":["Jesús, el curso se acaba, pero Tú te vienes con nosotros de vacaciones. No nos dejes solos. Amén.","Gracias, Señor, por este año. Cuida de todos los compañeros durante el verano. Amén.","Señor, nos despedimos hasta septiembre con pena y con ilusión. Ayúdanos a volver con más ganas. Amén.","Gracias, Jesús, por este equipo. Aunque no nos veamos, seguiremos siendo amigos. Amén.","Señor, en verano también estarás con nosotros: en la playa, en el pueblo y en casa. No te olvidaremos. Amén.","Gracias, Jesús. Este verano te rezaré alguna noche para no perder la costumbre. Amén.","Jesús, en este último partido queremos dejarnos el corazón, como despedida y como promesa. Amén.","Gracias por este último partido y por todo el curso. ¡Hasta pronto, y que Dios nos bendiga! Amén."]}]}]},"infantil":{"nombre":"Infantil","meses":[{"mes":"Septiembre","tema":"«Somos un equipo con misión»","semanas":[{"valor":"Acogida consciente","o":["Señor, empezamos temporada. Ayúdanos a acoger a cada compañero de verdad, no solo de palabra: que nadie se sienta fuera. Amén.","Gracias por este primer entrenamiento. Me propongo fijarme esta semana en quién necesita sentirse más acogido. Amén.","Jesús, hoy queremos acoger también a quien nos cae peor o juega distinto. Ahí se ve si somos equipo. Amén.","Gracias, Señor, por lo compartido hoy. Acoger es un trabajo de todos, y hoy hemos dado un paso. Amén.","Señor, la acogida se entrena también fuera: en clase hay compañeros nuevos que necesitan un sitio. Ayúdanos a dárselo. Amén.","Gracias por este entrenamiento. Mi compromiso de la semana: acercarme en el instituto a quien veo siempre solo. Amén.","Señor, antes de competir te pedimos acoger bien a todos: rivales, árbitros y compañeros que juegan menos. Amén.","Gracias por el partido. Que nuestra manera de recibir a los demás hable bien de este equipo. Amén."]},{"valor":"Respeto mutuo","o":["Jesús, el respeto no es solo no insultar: es valorar al otro. Enséñanos a respetarnos así en este equipo. Amén.","Gracias por el entrenamiento de hoy. Me pregunto con sinceridad: ¿he tratado a todos con respeto? Amén.","Señor, ayúdanos a cuidar cómo nos hablamos cuando hay fallos, cansancio o nervios. Amén.","Gracias, Jesús, porque el respeto mutuo hace que entrenar sea un buen lugar para todos. Amén.","Jesús, que el respeto no sea un uniforme que me quito al salir de la pista: los mismos modales en casa y en clase. Amén.","Gracias, Señor. Esta semana vigilaré cómo hablo en casa cuando estoy cansado o de mal humor. Amén.","Señor, que en el partido respetemos al rival como nos gustaría ser respetados, gane quien gane. Amén.","Gracias por el partido. El marcador se olvida; el respeto que damos, no. Amén."]},{"valor":"Normas y compromiso","o":["Señor, las normas del equipo no son un capricho: nos cuidan a todos. Ayúdanos a cumplirlas con madurez. Amén.","Gracias por este entrenamiento. Asumo mi parte: puntualidad, atención y esfuerzo no se negocian. Amén.","Jesús, ayúdanos a cumplir las normas también cuando nadie mira, que es cuando de verdad cuentan. Amén.","Gracias, Señor. Un equipo comprometido se construye con gestos pequeños repetidos cada día. Amén.","Señor, también fuera hay normas que nos cuidan: en casa, en clase, en la calle. Ayúdanos a cumplirlas con la misma seriedad. Amén.","Gracias por este rato. Esta semana cumpliré mis compromisos de estudio igual que cumplo los del equipo. Amén.","Señor, hoy nos comprometemos con el equipo los minutos que juguemos y también desde el banquillo. Amén.","Gracias por el partido. Cumplir lo que prometemos nos hace dignos de confianza. Amén."]},{"valor":"Propósito compartido","o":["Jesús, este equipo tiene una misión: crecer juntos como deportistas y como personas. Que no la perdamos de vista. Amén.","Gracias por el entrenamiento. Recordar para qué estamos aquí da sentido a cada ejercicio. Amén.","Señor, ayúdanos a remar todos en la misma dirección, aunque tengamos caracteres distintos. Amén.","Gracias, Jesús. Cuando el objetivo es común, las diferencias suman en vez de dividir. Amén.","Jesús, nuestra misión no acaba al salir del pabellón: también en el instituto podemos remar juntos hacia lo bueno. Amén.","Gracias, Señor. Buscaré esta semana un objetivo común con mis compañeros de clase y aportaré mi parte. Amén.","Señor, hoy salimos a competir con un propósito compartido: darlo todo y hacerlo bien. Amén.","Gracias por el partido. Hoy hemos jugado como lo que somos: un equipo con misión. Amén."]}]},{"mes":"Octubre","tema":"«Ama y actúa»","semanas":[{"valor":"Escucha activa","o":["Señor, escuchar de verdad es más que oír. Ayúdanos hoy a escuchar con atención plena. Amén.","Gracias por este entrenamiento. Me propongo escuchar esta semana sin interrumpir, también en casa y en clase. Amén.","Jesús, enséñanos a escuchar al compañero que lo está pasando mal, aunque no lo diga con palabras. Amén.","Gracias, Señor. Escuchar activamente es la primera forma de querer a alguien. Amén.","Señor, en casa también hace falta escucha activa: a los padres y a los hermanos, sin pantallas delante. Amén.","Gracias por este entrenamiento. Hoy en la cena escucharé de verdad, con el móvil lejos. Amén.","Señor, en el partido queremos escuchar las indicaciones y también los ánimos: ahí está la fuerza del equipo. Amén.","Gracias por el partido. Un equipo que se escucha juega mejor y vive mejor. Amén."]},{"valor":"Servicio generoso","o":["Jesús, Tú no viniste a ser servido sino a servir. Enséñanos a ayudar sin esperar nada a cambio. Amén.","Gracias por el entrenamiento. Me pregunto: ¿a quién he ayudado hoy sin que me lo pidieran? Amén.","Señor, que el servicio se nos note en lo concreto: recoger, ayudar, ceder, animar. Amén.","Gracias, Jesús. Servir con generosidad no nos hace menos: nos hace grandes. Amén.","Jesús, servir fuera de la pista tiene nombres concretos: recoger, acompañar, echar una mano en casa. Amén.","Gracias, Señor. Esta semana asumiré una tarea de casa sin que nadie me la recuerde. Amén.","Señor, hoy queremos jugar en modo servicio: para el equipo, no para lucirnos. Amén.","Gracias por el partido. Lo mejor de hoy: lo que hemos hecho por los demás. Amén."]},{"valor":"Reconciliación","o":["Señor, todos fallamos y todos herimos alguna vez. Danos humildad para pedir perdón y grandeza para darlo. Amén.","Gracias por este entrenamiento. Si tengo algo pendiente con alguien del equipo, quiero arreglarlo esta semana. Amén.","Jesús, ayúdanos a no dejar que un roce se convierta en distancia entre compañeros. Amén.","Gracias, Señor, por la paz que llega cuando nos reconciliamos de verdad. Amén.","Señor, si tengo un conflicto pendiente en clase o en casa, dame el valor de dar hoy el primer paso. Amén.","Gracias por este rato. Antes del fin de semana habré arreglado la cuenta pendiente que tengo. Amén.","Señor, si en el partido hay tensiones, ayúdanos a resolverlas con deportividad, no con rencor. Amén.","Gracias por el partido. Nos vamos sin cuentas pendientes: eso también es ganar. Amén."]},{"valor":"Amor concreto","o":["Jesús, amar no es solo un sentimiento: son hechos. Ayúdanos a demostrarlo hoy con acciones. Amén.","Gracias por el entrenamiento. El amor concreto de hoy: un ánimo, una ayuda, un buen gesto. Amén.","Señor, enséñanos a querer a los compañeros como son, no como nos gustaría que fueran. Amén.","Gracias, Jesús. Los hechos de hoy valen más que mil palabras bonitas. Amén.","Jesús, amar con hechos también en casa: un gesto concreto vale más que mil «te quiero» de palabra. Amén.","Gracias, Señor. Mi hecho de amor de esta semana ya tiene destinatario en mi familia. Amén.","Señor, que nuestro amor al equipo se vea hoy en cada esfuerzo y cada balón disputado. Amén.","Gracias por el partido. Amar con hechos también se entrena, y hoy hemos entrenado bien. Amén."]}]},{"mes":"Noviembre","tema":"«Luz en medio del mundo»","semanas":[{"valor":"Ser testimonio","o":["Señor, que nuestra forma de jugar, hablar y comportarnos diga algo bueno de Ti. Amén.","Gracias por este entrenamiento. Me pregunto: ¿qué ven los demás cuando me ven jugar? Amén.","Jesús, ayúdanos a ser coherentes: los mismos en la pista, en clase, en casa y en redes. Amén.","Gracias, Señor. El mejor testimonio no se predica: se vive. Amén.","Señor, mi testimonio también se ve en el instituto y en las redes: que diga algo bueno de Ti. Amén.","Gracias por este entrenamiento. Esta semana revisaré qué imagen doy en mis redes y grupos. Amén.","Señor, hoy nos ven familias, rivales y árbitros. Que vean un equipo del que Tú estarías orgulloso. Amén.","Gracias por el partido. Ojalá nuestro juego haya sido hoy nuestro mejor testimonio. Amén."]},{"valor":"Construir esperanza","o":["Jesús, hay compañeros que atraviesan momentos difíciles. Ayúdanos a ser para ellos motivo de esperanza. Amén.","Gracias por el entrenamiento. Esta semana quiero animar a alguien que lo necesite. Amén.","Señor, enséñanos a levantar al que se cae, en el juego y fuera de él. Amén.","Gracias, Jesús. Sembrar esperanza en otros nos la devuelve multiplicada. Amén.","Jesús, en mi clase hay quien atraviesa un mal momento: ayúdame a ser esperanza también allí. Amén.","Gracias, Señor. Esta semana animaré a un compañero de clase que lo está pasando mal. Amén.","Señor, si el partido se pone cuesta arriba, que seamos nosotros quienes levanten al equipo. Amén.","Gracias por el partido. No rendirse también es una forma de esperanza. Amén."]},{"valor":"Autenticidad","o":["Señor, líbranos de aparentar lo que no somos. Ayúdanos a ser auténticos, con virtudes y defectos. Amén.","Gracias por este entrenamiento. Prefiero ser yo de verdad que una imagen perfecta de mentira. Amén.","Jesús, danos valor para no disfrazarnos por encajar y para aceptar a cada uno como es. Amén.","Gracias, Señor. En este equipo no hace falta fingir: podemos ser nosotros mismos. Amén.","Señor, ser auténtico también cuesta en el instituto, donde hay presión por encajar. Dame libertad. Amén.","Gracias por este rato. Esta semana diré lo que pienso con respeto, aunque no sea lo popular. Amén.","Señor, hoy queremos competir siendo auténticos: sin teatro, sin excusas, sin engaños. Amén.","Gracias por el partido. Hemos jugado a cara descubierta, y así queremos vivir. Amén."]},{"valor":"Solidaridad","o":["Jesús, abre nuestros ojos a las necesidades de los demás, dentro y fuera del equipo. Amén.","Gracias por el entrenamiento. La solidaridad empieza cerca: en el compañero que hoy necesita ayuda. Amén.","Señor, enséñanos a compartir lo que tenemos y lo que somos: tiempo, ánimo, talento. Amén.","Gracias, Jesús. Un equipo solidario dentro será solidario fuera. Amén.","Jesús, la solidaridad empieza cerca: en casa, en clase, en mi barrio hay necesidades que puedo atender. Amén.","Gracias, Señor. Buscaré esta semana una forma concreta de ayudar fuera del equipo. Amén.","Señor, hoy jugamos también pensando en quienes no pueden: que valoremos lo que tenemos. Amén.","Gracias por el partido. Que esta suerte de poder jugar nos haga más generosos. Amén."]}]},{"mes":"Diciembre","tema":"«Dios se hace uno de nosotros»","semanas":[{"valor":"Prepararse para acoger","o":["Señor, el Adviento es tiempo de preparar tu llegada. Ayúdanos a preparar el corazón, no solo el calendario. Amén.","Gracias por este entrenamiento. Mi preparación para la Navidad: mejorar algo concreto esta semana. Amén.","Jesús, que preparemos tu llegada haciendo sitio: en la agenda, en el equipo y en el corazón. Amén.","Gracias, Señor. Prepararse por dentro es el mejor adorno de la Navidad. Amén.","Señor, preparar la Navidad en casa es más que decorar: es estar disponible y hacer la convivencia fácil. Amén.","Gracias por este entrenamiento. Mi preparación de esta semana: colaborar en casa sin protestar. Amén.","Señor, como preparamos cada partido, queremos preparar tu Navidad: con intención y con trabajo. Amén.","Gracias por el partido. Seguimos preparando la llegada de lo importante. Amén."]},{"valor":"Superar el egoísmo","o":["Jesús, Tú lo diste todo al hacerte uno de nosotros. Ayúdanos a salir de nuestro egoísmo. Amén.","Gracias por el entrenamiento. Reviso con sinceridad: ¿cuándo he pensado hoy solo en mí? Amén.","Señor, enséñanos a preferir el «nosotros» al «yo»: en el juego, en casa y con los amigos. Amén.","Gracias, Jesús. Cada gesto generoso de hoy le ha ganado terreno al egoísmo. Amén.","Jesús, el egoísmo también se combate en casa: en el mando de la tele, en los turnos, en el tiempo compartido. Amén.","Gracias, Señor. Esta semana cederé en casa en algo que normalmente peleo. Amén.","Señor, hoy queremos jugar sin egoísmos: el pase al mejor situado, el esfuerzo por el equipo. Amén.","Gracias por el partido. Jugar para los demás sabe mejor que jugar para uno mismo. Amén."]},{"valor":"Acoger al diferente","o":["Señor, Tú naciste pobre y fuiste rechazado. Ayúdanos a acoger a quien es distinto o se queda fuera. Amén.","Gracias por este entrenamiento. Esta semana me acercaré a quien menos trato tiene conmigo. Amén.","Jesús, que las diferencias de carácter, nivel u origen no nos separen: nos enriquecen. Amén.","Gracias, Señor, por un equipo donde cabe gente diferente. Así se parece más a tu familia. Amén.","Señor, estas fiestas hay gente que se queda fuera: ayúdame a fijarme en quién está solo en Navidad. Amén.","Gracias por este rato. Pensaré con mi familia a quién podemos acompañar o felicitar estas fiestas. Amén.","Señor, hoy queremos tratar bien también al rival: diferente camiseta, misma dignidad. Amén.","Gracias por el partido. Acoger al diferente nos ha hecho hoy mejores personas. Amén."]},{"valor":"Alegría del nacimiento","o":["Jesús, tu nacimiento es la mejor noticia de la historia. Llénanos de esa alegría verdadera. Amén.","Gracias, Señor, por la Navidad que llega. Quiero llevar esta alegría a mi casa. Amén.","Señor, que nuestra alegría no dependa solo de resultados: nace de saber que Tú estás con nosotros. Amén.","Gracias, Jesús. Compartir la alegría la multiplica: felices fiestas a todo el equipo. Amén.","Jesús, que la alegría del nacimiento se note en mi casa: llevo yo la buena noticia. Amén.","Gracias, Señor. Estas fiestas seré yo quien ponga la alegría en la mesa, también cuando haya tensiones. Amén.","Señor, hoy jugamos con alegría de Navidad: agradecidos, ilusionados y en equipo. Amén.","Gracias por el partido y por este trimestre. Nos vamos a celebrar que Dios está con nosotros. Amén."]}]},{"mes":"Enero","tema":"«Jesús guía nuestros pasos»","semanas":[{"valor":"Mirar con profundidad","o":["Señor, enséñanos a mirar más allá de lo evidente: a las personas, a los hechos y a nosotros mismos. Amén.","Gracias por este entrenamiento. Hoy quiero mirar mi juego y mi actitud con honestidad. Amén.","Jesús, ayúdanos a no juzgar por las apariencias, ni a compañeros ni a rivales. Amén.","Gracias, Señor. Mirar con profundidad nos ayuda a comprender antes de criticar. Amén.","Señor, mirar con profundidad también en clase: detrás de cada compañero hay una historia que no veo. Amén.","Gracias por este entrenamiento. Esta semana no juzgaré a nadie del instituto por su fachada. Amén.","Señor, hoy queremos leer bien el partido y, sobre todo, leernos bien a nosotros mismos. Amén.","Gracias por el partido. Lo importante casi nunca está en la superficie. Amén."]},{"valor":"Nuevos comienzos","o":["Jesús, empieza el año: gracias por esta página en blanco. Ayúdanos a escribirla bien. Amén.","Gracias por el primer entrenamiento del año. Mi propósito deportivo y personal empieza hoy. Amén.","Señor, danos la valentía de volver a empezar donde el año pasado nos quedamos a medias. Amén.","Gracias, Jesús, porque contigo siempre hay segunda oportunidad. Amén.","Jesús, el año nuevo también es para el estudio y la familia: ayúdame a empezar bien en todo. Amén.","Gracias, Señor. Mi propósito concreto de esta semana está elegido y va más allá del deporte. Amén.","Señor, estrenamos año de competición: que lo empecemos con humildad y con ambición sana. Amén.","Gracias por el partido. Buen comienzo: ahora, a sostenerlo. Amén."]},{"valor":"Sabiduría en decisiones","o":["Señor, cada día tomamos decisiones que nos construyen o nos estropean. Danos sabiduría para decidir bien. Amén.","Gracias por este entrenamiento. Decidir rápido se entrena; decidir bien, también. Amén.","Jesús, ayúdanos a pedir consejo a quien nos quiere bien antes de decidir lo importante. Amén.","Gracias, Señor. Las buenas decisiones de hoy son la buena vida de mañana. Amén.","Señor, esta semana tomaré decisiones también fuera de la pista: dame sabiduría para las pequeñas de cada día. Amén.","Gracias por este rato. Antes de decidir algo importante esta semana, pediré consejo a quien me quiere bien. Amén.","Señor, en el partido decidimos en décimas de segundo: que decidamos con cabeza y con nobleza. Amén.","Gracias por el partido. Cada buena decisión, en el juego y en la vida, te la ofrecemos. Amén."]},{"valor":"Confianza renovada","o":["Jesús, renueva nuestra confianza: en Ti, en el equipo y en nosotros mismos. Amén.","Gracias por el entrenamiento. La confianza se recupera trabajando, y hoy hemos trabajado. Amén.","Señor, ayúdanos a confiar en los compañeros después de los fallos: ahí se demuestra el equipo. Amén.","Gracias, Jesús. La confianza que damos hace crecer a quien la recibe. Amén.","Jesús, renueva mi confianza también en casa: en mis padres, aunque a veces no los entienda. Amén.","Gracias, Señor. Esta semana confiaré algo mío a mi familia en vez de guardármelo todo. Amén.","Señor, salimos a competir confiados, no confiados de más: con fe y con trabajo. Amén.","Gracias por el partido. Nuestra confianza no depende del marcador: está en buenas manos. Amén."]}]},{"mes":"Febrero","tema":"«Elegir lo bueno»","semanas":[{"valor":"Discernimiento","o":["Señor, enséñanos a distinguir lo que nos hace bien de lo que solo lo aparenta. Amén.","Gracias por este entrenamiento. Antes de actuar, pensar; antes de pensar, preguntarte a Ti. Amén.","Jesús, ayúdanos a discernir bien también en lo pequeño: qué digo, qué comparto, con quién voy. Amén.","Gracias, Señor. Aprender a elegir es aprender a vivir. Amén.","Señor, el discernimiento se juega sobre todo fuera: qué veo, qué comparto, con quién voy. Dame criterio. Amén.","Gracias por este entrenamiento. Esta semana revisaré con criterio lo que consumo en redes. Amén.","Señor, en la presión del partido, ayúdanos a distinguir lo que suma de lo que nos pierde. Amén.","Gracias por el partido. Hoy hemos entrenado la mirada para elegir lo bueno. Amén."]},{"valor":"Libertad y responsabilidad","o":["Jesús, gracias por hacernos libres. Ayúdanos a entender que libertad sin responsabilidad no es libertad. Amén.","Gracias por el entrenamiento. Soy libre de esforzarme o no: hoy he elegido esforzarme. Amén.","Señor, que asumamos las consecuencias de lo que hacemos, sin excusas ni culpas repartidas. Amén.","Gracias, Jesús. Responder de nuestros actos nos hace mayores de verdad. Amén.","Jesús, mi libertad también tiene consecuencias en casa y en clase: ayúdame a responder de lo mío. Amén.","Gracias, Señor. Esta semana, si me equivoco fuera de la pista, lo reconoceré sin excusas. Amén.","Señor, en el partido nadie elige por mí: mi esfuerzo y mi juego limpio son mi responsabilidad. Amén.","Gracias por el partido. Hemos ejercido bien nuestra libertad. Amén."]},{"valor":"Perseverancia","o":["Señor, danos constancia: para entrenar cuando cuesta, estudiar cuando cansa y mejorar cuando parece que no avanzamos. Amén.","Gracias por este entrenamiento. La perseverancia de hoy es el nivel de mañana. Amén.","Jesús, ayúdanos a animar al compañero que está a punto de rendirse. Amén.","Gracias, Señor. Los resultados llegan tarde, pero llegan para quien persevera. Amén.","Señor, la perseverancia también es para el estudio: seguir cuando cansa, repasar cuando aburre. Amén.","Gracias por este rato. Esta semana perseveraré en la asignatura que más me cuesta. Amén.","Señor, hoy queremos competir los minutos completos: perseverar hasta el final, pase lo que pase. Amén.","Gracias por el partido. No nos hemos rendido, y eso ya nos hace más fuertes. Amén."]},{"valor":"Justicia y coherencia","o":["Jesús, enséñanos a ser justos: a dar a cada uno lo suyo y a tratar a todos con equidad. Amén.","Gracias por el entrenamiento. Ser justo empieza por reconocer los méritos de los demás. Amén.","Señor, danos coherencia: que nuestros actos digan lo mismo que nuestras palabras. Amén.","Gracias, Jesús. La coherencia se construye en lo pequeño de cada día. Amén.","Jesús, ser justo y coherente también en el instituto: con los profes, en los trabajos en grupo, en los rumores. Amén.","Gracias, Señor. Esta semana no participaré en burlas ni rumores, aunque se rían todos. Amén.","Señor, hoy queremos ganar solo lo que sea justo ganar: sin trampas, sin teatro, sin atajos. Amén.","Gracias por el partido. Nuestra mejor jugada: ser justos y coherentes. Amén."]}]},{"mes":"Marzo","tema":"«Vivir desde dentro» (Cuaresma)","semanas":[{"valor":"Conversión personal","o":["Señor, empieza la Cuaresma. Ayúdame a mirar dentro y a cambiar lo que me aleja de Ti y de los demás. Amén.","Gracias por este entrenamiento. Mi conversión concreta: elegir un defecto y trabajarlo esta Cuaresma. Amén.","Jesús, convertirse no es sentirse mal: es girar hacia lo bueno. Ayúdanos a girar. Amén.","Gracias, Señor, por la oportunidad de cambiar. Contigo, ningún defecto tiene la última palabra. Amén.","Señor, mi conversión de Cuaresma tiene que notarse en casa antes que en ningún sitio. Ayúdame. Amén.","Gracias por este entrenamiento. Mi cambio de esta semana lo notará primero mi familia. Amén.","Señor, que en el partido se note nuestra conversión: menos protestas, más trabajo. Amén.","Gracias por el partido. Seguimos en obras, y eso es buena señal. Amén."]},{"valor":"Silencio interior","o":["Señor, vivimos rodeados de ruido y pantallas. Enséñanos el valor de un momento de silencio contigo. (Breve silencio.) Amén.","Gracias por este entrenamiento. Esta semana buscaré cada día un minuto de silencio para pensar y rezar. Amén.","Jesús, en el silencio se escucha lo importante. Ayúdanos a no tenerle miedo. Amén.","Gracias, Señor, por este rato. En el silencio interior encontramos claridad y paz. Amén.","Jesús, buscaré silencio interior también entre semana: un rato sin pantallas para pensar y rezar. Amén.","Gracias, Señor. Ya tengo elegido mi momento de silencio para cada día de esta semana. Amén.","Señor, antes del partido hacemos silencio por dentro: concentración, calma y confianza en Ti. Amén.","Gracias por el partido. En el silencio del corazón te decimos lo que las palabras no alcanzan. Amén."]},{"valor":"Lucha y superación","o":["Jesús, la Cuaresma es entrenamiento del espíritu. Danos fuerza para luchar contra lo que nos frena. Amén.","Gracias por este entrenamiento. Superarse no es ser mejor que otros: es ser mejor que ayer. Amén.","Señor, ayúdanos a luchar sobre todo contra nuestras excusas y nuestra pereza. Amén.","Gracias, Jesús. Cada pequeña victoria interior de hoy cuenta. Amén.","Señor, mi lucha de esta semana está fuera: contra la pereza en el estudio y el desorden en casa. Amén.","Gracias por este rato. Esta semana me superaré en algo concreto fuera de la pista. Amén.","Señor, hoy toca luchar cada balón y cada minuto: que el esfuerzo sea nuestra seña de identidad. Amén.","Gracias por el partido. La lucha de hoy nos ha hecho crecer, gane quien gane. Amén."]},{"valor":"Ayuno solidario","o":["Señor, el ayuno cristiano no es pasar hambre: es privarse de algo para darlo a quien lo necesita. Enséñanos. Amén.","Gracias por este entrenamiento. Mi ayuno de esta semana: renunciar a algo mío para compartirlo. Amén.","Jesús, abre nuestros ojos a los que tienen menos, aquí cerca y lejos. Amén.","Gracias, Señor. Lo que damos con amor nunca se pierde. Amén.","Jesús, que mi ayuno de Cuaresma sea solidario: renunciar a algo mío para que otro tenga. Amén.","Gracias, Señor. Esta semana destinaré a compartir lo que me ahorre de caprichos. Amén.","Señor, hoy jugamos agradecidos: poder entrenar y competir es un privilegio que muchos no tienen. Amén.","Gracias por el partido. Que nuestra suerte nos haga generosos, no cómodos. Amén."]}]},{"mes":"Abril","tema":"«Vivir con sentido» (Pascua)","semanas":[{"valor":"Vida nueva","o":["Jesús resucitado, gracias por la Pascua. Renueva nuestra vida, nuestra ilusión y nuestro equipo. Amén.","Gracias por este entrenamiento. La Pascua me invita a estrenar actitudes: hoy he empezado. Amén.","Señor, ayúdanos a dejar atrás lo viejo: rencores, quejas y malos hábitos. Amén.","Gracias, Jesús. Contigo siempre se puede volver a empezar de verdad. Amén.","Señor resucitado, la vida nueva empieza en lo cotidiano: en cómo me levanto, saludo y trato en casa. Amén.","Gracias por este entrenamiento. Esta semana estrenaré actitud nueva en casa, no solo aquí. Amén.","Señor, jugamos con espíritu de Pascua: energía nueva, mentalidad nueva. Amén.","Gracias por el partido. ¡Cristo vive, y se nota en cómo vivimos! Amén."]},{"valor":"Paz interior","o":["Señor, danos tu paz: esa que no depende de que todo salga bien. Amén.","Gracias por este entrenamiento. La paz interior también se entrena: respirar, confiar, perdonar. Amén.","Jesús, ayúdanos a no perder la calma con los fallos, los nuestros y los de los demás. Amén.","Gracias, Señor, por la serenidad de hoy. Queremos llevarla a los exámenes y a casa. Amén.","Jesús, dame tu paz también para los exámenes y los agobios del instituto. Amén.","Gracias, Señor. Esta semana me tomaré los nervios del estudio con tu paz: trabajo y confianza. Amén.","Señor, que compitamos intensos por fuera y serenos por dentro. Amén.","Gracias por el partido. Nos llevamos la paz puesta, pase lo que pase con el resultado. Amén."]},{"valor":"Alegría profunda","o":["Jesús, enséñanos la diferencia entre la diversión que pasa y la alegría que permanece. Amén.","Gracias por este entrenamiento. La alegría profunda viene de hacer las cosas bien y con otros. Amén.","Señor, que nuestra alegría no dependa de likes ni de marcadores: que nazca de dentro. Amén.","Gracias, Jesús, por la alegría de Pascua que nadie nos puede quitar. Amén.","Señor, la alegría profunda no depende del plan del fin de semana: enséñame a encontrarla en lo sencillo. Amén.","Gracias por este rato. Esta semana disfrutaré de algo sencillo y gratuito, y te lo agradeceré. Amén.","Señor, hoy queremos disfrutar de verdad del partido: del juego, del equipo, del deporte. Amén.","Gracias por el partido. La alegría de jugar juntos vale más que cualquier resultado. Amén."]},{"valor":"Transformación del corazón","o":["Señor, no queremos cambiar solo por fuera. Transforma nuestro corazón desde dentro. Amén.","Gracias por este entrenamiento. Un corazón que cambia se nota en cómo trata a los demás. Amén.","Jesús, ablanda lo que tengamos duro: orgullo, envidias, indiferencia. Amén.","Gracias, Señor, por lo que estás cambiando en nosotros este curso. Amén.","Jesús, transforma mi corazón también para los de casa: ellos reciben mi peor versión demasiadas veces. Amén.","Gracias, Señor. Esta semana mi familia notará mi mejor versión, la que saco aquí. Amén.","Señor, que el deporte nos siga transformando: de individuos a equipo, de buenos a mejores. Amén.","Gracias por el partido. El mejor cambio no está en el marcador: está en nosotros. Amén."]}]},{"mes":"Mayo","tema":"«María, modelo de entrega»","semanas":[{"valor":"Disponibilidad","o":["Señor, María dijo «aquí estoy». Enséñanos a estar disponibles cuando el equipo, la familia o un amigo nos necesitan. Amén.","Gracias por este entrenamiento. Estar disponible es un modo concreto de querer. Amén.","Jesús, líbranos del «no me toca» y del «que lo haga otro». Amén.","Gracias, Señor, por los compañeros que siempre están. Quiero ser uno de ellos. Amén.","Señor, estar disponible también en casa: para el recado, la ayuda y la conversación que no apetece. Amén.","Gracias por este entrenamiento. Esta semana diré «cuenta conmigo» en casa al menos una vez al día. Amén.","Señor, hoy estamos disponibles para lo que el equipo necesite: correr, defender, esperar, animar. Amén.","Gracias por el partido. Hemos estado donde había que estar. Amén."]},{"valor":"Escucha y decisión","o":["Jesús, María escuchó y después decidió con valentía. Enséñanos ese orden: primero escuchar, luego decidir. Amén.","Gracias por este entrenamiento. Antes de decidir algo importante, quiero escuchar a quien me quiere bien. Amén.","Señor, ayúdanos a escuchar también lo que no nos gusta oír, cuando es verdad y nos ayuda. Amén.","Gracias, Señor. Escuchar bien es el principio de decidir bien. Amén.","Jesús, escuchar antes de decidir también vale para el instituto: profesores y padres ven lo que yo no veo. Amén.","Gracias, Señor. Esta semana escucharé un consejo hasta el final antes de responder. Amén.","Señor, en el partido: escuchar al entrenador, leer el juego y decidir con criterio. Amén.","Gracias por el partido. Buenas decisiones nacen de buenas escuchas. Amén."]},{"valor":"Valentía en la fe","o":["Señor, a veces cuesta mostrar que creemos. Danos la valentía serena de María. Amén.","Gracias por este entrenamiento. No me avergüenzo de rezar ni de intentar vivir como cristiano. Amén.","Jesús, danos valor para defender lo justo aunque no sea lo popular. Amén.","Gracias, Señor, por los testigos valientes que nos inspiran, empezando por tu Madre. Amén.","Señor, dame la valentía de María también fuera: para rezar, para decir que creo, para no esconderme. Amén.","Gracias por este rato. Esta semana no esconderé mi fe si sale el tema en clase. Amén.","Señor, hoy jugamos con fe y sin miedo: valientes en el esfuerzo y en el juego limpio. Amén.","Gracias por el partido. La valentía de hoy también fue un acto de fe. Amén."]},{"valor":"Humildad activa","o":["Jesús, María sirvió sin buscar aplausos. Enséñanos esa humildad que trabaja y no presume. Amén.","Gracias por este entrenamiento. Humildad activa: reconocer errores y corregirlos trabajando. Amén.","Señor, ayúdanos a celebrar los éxitos de otros como propios y los propios sin soberbia. Amén.","Gracias, Señor. La humildad no nos hace pequeños: nos hace verdaderos. Amén.","Jesús, la humildad activa también en casa: reconocer, pedir perdón y corregir sin dramas. Amén.","Gracias, Señor. Esta semana pediré perdón en casa a la primera, sin esperar a que se pase. Amén.","Señor, ganemos o perdamos hoy, danos la misma cara: agradecida y humilde. Amén.","Gracias por el partido. Con humildad, mañana seguiremos mejorando. Amén."]}]},{"mes":"Junio","tema":"«Gracias, Señor»","semanas":[{"valor":"Recoger el camino","o":["Señor, se acaba el curso. Ayúdanos a mirar atrás y reconocer todo lo andado: esfuerzos, mejoras y momentos vividos. Amén.","Gracias por este entrenamiento. Hago memoria: ¿en qué he crecido este año como deportista y como persona? Amén.","Jesús, que sepamos aprender tanto de los aciertos como de los errores de esta temporada. Amén.","Gracias, Señor, por cada paso del camino, también por los difíciles. Amén.","Señor, ayúdame a mirar el curso entero, no solo el deporte: qué he aprendido en clase, en casa, en la fe. Amén.","Gracias por este entrenamiento. Esta semana haré balance del curso con alguien de mi familia. Amén.","Señor, hoy jugamos con todo lo aprendido en el año: que se vea el camino recorrido. Amén.","Gracias por el partido. El camino de este curso nos ha traído hasta aquí, y ha valido la pena. Amén."]},{"valor":"Acción de gracias","o":["Señor, hoy es día de dar gracias: por el deporte, por el equipo, por los entrenadores y por las familias. Amén.","Gracias por este entrenamiento y por todos los del curso. Que no se nos olvide agradecer también en casa. Amén.","Jesús, gracias por los monitores y entrenadores: por su tiempo, su paciencia y su ejemplo. Amén.","Gracias, Señor, por este equipo. Ha sido un regalo compartir el año con ellos. Amén.","Jesús, el agradecimiento de fin de curso también es para los profesores y para mi familia. Amén.","Gracias, Señor. Antes de acabar el curso daré las gracias a un profesor y a mis padres, en persona. Amén.","Señor, este partido es nuestro «gracias» en forma de juego: queremos jugarlo a la altura del regalo. Amén.","Gracias por el partido y por la temporada entera. De corazón: gracias. Amén."]},{"valor":"Celebrar los frutos","o":["Señor, enséñanos a celebrar lo que hemos conseguido juntos: lo deportivo y, sobre todo, lo humano. Amén.","Gracias por este entrenamiento festivo. Celebrar juntos también construye equipo. Amén.","Jesús, que celebremos los frutos de todos, no solo los de los que más destacan. Amén.","Gracias, Señor, por los frutos de este año: amistad, esfuerzo, crecimiento y fe. Amén.","Señor, celebrar los frutos también en casa: compartir con la familia lo que este año ha ido bien. Amén.","Gracias por este rato. Celebraré el final de curso agradeciendo en casa lo bueno del año. Amén.","Señor, que este partido sea una fiesta del deporte bien vivido. Amén.","Gracias por el partido. Celebramos lo vivido y a quienes lo han hecho posible. Amén."]},{"valor":"Misión para el futuro","o":["Señor, el curso acaba pero la misión sigue: ser buenas personas allá donde estemos este verano. Amén.","Gracias por este entrenamiento. Me llevo una misión: mantener en vacaciones lo aprendido aquí. Amén.","Jesús, acompaña a cada compañero este verano y tráenos de vuelta con más ganas todavía. Amén.","Gracias, Señor, por este año. Lo que hemos crecido no se queda en la pista: viene con nosotros. Amén.","Jesús, mi misión de verano: mantener fuera de temporada lo que he aprendido aquí dentro. Amén.","Gracias, Señor. Me llevo al verano un compromiso concreto, y en septiembre te cuento. Amén.","Señor, último partido: queremos cerrarlo dándolo todo, como resumen del curso y promesa del que viene. Amén.","Gracias por el partido y por la temporada. Esto no se acaba: continúa en cada uno de nosotros. Amén."]}]}]},"cadete":{"nombre":"Cadete · Júnior","meses":[{"mes":"Septiembre","tema":"«Quién soy yo en este equipo»","semanas":[{"valor":"Identidad personal","o":["Señor, empieza la temporada y empiezo yo: ayúdame a saber quién soy y quién quiero llegar a ser, dentro y fuera de la pista. Amén.","Gracias por este entrenamiento. Mi identidad no la deciden las etiquetas ni las redes: la construyo con mis decisiones. Amén.","Jesús, líbrame de vivir de apariencias. Que sea el mismo aquí, en casa, en clase y en redes. Amén.","Gracias, Señor. Hoy he sumado un ladrillo a la persona que quiero ser. Amén.","Señor, quién soy no se decide solo aquí: se decide en cómo vivo el resto de la semana. Que haya un solo yo. Amén.","Gracias por este entrenamiento. Esta semana observaré si soy la misma persona en la pista, en clase, en casa y en redes. Amén.","Señor, que la competición no ahogue mi identidad: sé quién soy y a qué juego, gane o pierda. Amén.","Gracias por el partido. Me pregunto: ¿el que ha competido hoy es el que quiero ser? Acompáñame en la respuesta. Amén."]},{"valor":"Respeto mutuo","o":["Señor, el respeto en un vestuario no se impone: se gana y se da. Enséñanos a darlo primero. Amén.","Gracias por este entrenamiento. Reviso mi lenguaje y mis bromas: ¿construyen o hieren? Amén.","Jesús, ayúdanos a respetar también al que piensa, juega o vive distinto. Amén.","Gracias, Señor. Un equipo que se respeta puede decirse las verdades sin romperse. Amén.","Jesús, el respeto de verdad se mide fuera: con los profesores que no me caen bien, con mis padres cuando discutimos. Amén.","Gracias, Señor. Esta semana cuidaré el tono precisamente con quien más me cuesta. Amén.","Señor, hoy el respeto se juega en serio: rivales, árbitros y compañeros, con presión y sin excusas. Amén.","Gracias por el partido. Del marcador se olvidará todo el mundo; de cómo tratamos a la gente, nadie. Amén."]},{"valor":"Responsabilidad","o":["Señor, hacerse mayor es responder de lo que uno hace. Ayúdame a asumir mi parte sin excusas. Amén.","Gracias por este entrenamiento. Mi rendimiento, mi actitud y mis compromisos son responsabilidad mía. Amén.","Jesús, líbranos de la cultura de la excusa: el árbitro, el césped, el profesor, la suerte. Amén.","Gracias, Señor. Asumir errores sin hundirse y aciertos sin creérselo: eso es madurar. Amén.","Señor, responder de lo mío también fuera: mis estudios, mis horarios, mis compromisos son míos. Amén.","Gracias por este rato. Esta semana no le echaré la culpa a nadie de lo que dependa de mí. Amén.","Señor, hoy me hago responsable de mi juego y de mi conducta, juegue muchos minutos o pocos. Amén.","Gracias por el partido. Hemos respondido como equipo, y eso no es poco. Amén."]},{"valor":"Objetivos comunes","o":["Señor, un equipo son talentos distintos apuntando al mismo sitio. Alinea nuestros objetivos. Amén.","Gracias por este entrenamiento. Mi objetivo personal solo tiene sentido dentro del objetivo del equipo. Amén.","Jesús, ayúdanos a renunciar a protagonismos cuando el bien del grupo lo pida. Amén.","Gracias, Señor. Remar juntos cansa menos y llega más lejos. Amén.","Jesús, también mi clase y mi casa tienen objetivos comunes: que no vaya cada uno a lo suyo por mi culpa. Amén.","Gracias, Señor. Esta semana aportaré al grupo también fuera: en el trabajo de clase y en casa. Amén.","Señor, hoy competimos por algo común: que nadie juegue su partido aparte. Amén.","Gracias por el partido. Cuando el objetivo es de todos, el mérito también. Amén."]}]},{"mes":"Octubre","tema":"«Amar con hechos»","semanas":[{"valor":"Escuchar con empatía","o":["Señor, enséñanos a escuchar poniéndonos en el lugar del otro, no preparando ya nuestra respuesta. Amén.","Gracias por este entrenamiento. Esta semana quiero escuchar de verdad a alguien a quien suelo ignorar. Amén.","Jesús, hay compañeros que cargan mochilas que no vemos. Danos oído y corazón para notarlo. Amén.","Gracias, Señor. Escuchar con empatía es amar con los oídos. Amén.","Señor, la empatía se entrena fuera: escuchar a mis padres poniéndome en su lugar cambia las conversaciones. Amén.","Gracias por este entrenamiento. Esta semana escucharé en casa una conversación entera sin interrumpir ni mirar el móvil. Amén.","Señor, en la tensión del partido, que sepamos escucharnos en vez de reprocharnos. Amén.","Gracias por el partido. Un equipo que se escucha bajo presión es un equipo de verdad. Amén."]},{"valor":"Servicio sin excusas","o":["Señor, servir sin excusas: sin «no me toca», sin «estoy cansado», sin «que lo haga otro». Enséñanos. Amén.","Gracias por este entrenamiento. El servicio de verdad se nota cuando cuesta, no cuando sobra. Amén.","Jesús, Tú lavaste los pies a tus discípulos. Que ningún servicio nos parezca poco digno. Amén.","Gracias, Señor. Servir calladamente vale más que ayudar para la foto. Amén.","Jesús, servir sin excusas también de lunes a viernes: en casa nadie me va a convocar, tengo que verlo yo. Amén.","Gracias, Señor. Esta semana haré en casa el servicio que nadie quiere hacer, sin anunciarlo. Amén.","Señor, hoy quiero jugar en servicio del equipo: el trabajo sucio también gana partidos. Amén.","Gracias por el partido. Lo que hicimos por los demás es lo que quedará. Amén."]},{"valor":"Reconciliación activa","o":["Señor, reconciliarse no es esperar a que se pase el enfado: es dar el primer paso. Danos ese valor. Amén.","Gracias por este entrenamiento. Si tengo un conflicto abierto, esta semana tomo yo la iniciativa. Amén.","Jesús, enséñanos a pedir perdón mirando a los ojos y a perdonar sin pasar factura. Amén.","Gracias, Señor. Las heridas que se cierran bien hacen al equipo más fuerte por la cicatriz. Amén.","Señor, si tengo una reconciliación pendiente fuera del equipo, dame el valor de dar yo el primer paso esta semana. Amén.","Gracias por este rato. Ya sé con quién tengo que hablar: esta semana lo haré. Amén.","Señor, si el partido calienta los ánimos, que seamos los primeros en tender la mano. Amén.","Gracias por el partido. Salimos del campo sin deudas pendientes con nadie. Amén."]},{"valor":"Amor que transforma","o":["Señor, el amor de verdad cambia a las personas. Ayúdanos a querer así: con hechos que transforman. Amén.","Gracias por este entrenamiento. ¿A quién ha mejorado hoy mi manera de tratarle? Amén.","Jesús, que nuestro afecto no sea solo para los nuestros: también para el difícil, el nuevo, el distinto. Amén.","Gracias, Señor. Donde hay amor concreto, la gente crece. También en un vestuario. Amén.","Jesús, el amor que transforma se juega en lo cotidiano: en casa, con los amigos, con quien nadie mira. Amén.","Gracias, Señor. Esta semana trataré a alguien de forma que le ayude a crecer, no solo a pasar el rato. Amén.","Señor, que nuestra forma de competir hoy deje al deporte mejor de como lo encontramos. Amén.","Gracias por el partido. Amar con hechos también se demuestra compitiendo. Amén."]}]},{"mes":"Noviembre","tema":"«Luz en medio de lo difícil»","semanas":[{"valor":"Testimonio coherente","o":["Señor, que no haya distancia entre lo que decimos creer y lo que hacemos. Danos coherencia. Amén.","Gracias por este entrenamiento. Mi vida es el único evangelio que algunos leerán: que se entienda. Amén.","Jesús, coherencia también en lo oculto: en redes, en los grupos, cuando nadie del equipo mira. Amén.","Gracias, Señor. Ser coherente cuesta, pero es la única forma de ser creíble. Amén.","Señor, mi coherencia se ve sobre todo en redes y en los grupos: que lo que publico y río no me desmienta. Amén.","Gracias por este entrenamiento. Esta semana auditaré mis redes: fuera lo que no diría a la cara. Amén.","Señor, hoy nos mira gente: que nuestro comportamiento sea nuestro mejor testimonio. Amén.","Gracias por el partido. Que quien nos vio jugar haya visto alg
